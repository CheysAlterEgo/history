<!DOCTYPE html>
<html>
<head>
  <title>The Chronicle</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: "Georgia", serif;
      background-color: #f4f1ea;
      color: #2f2a25;
    }

    h1 {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-style: italic;
      margin-bottom: 40px;
    }

    .image-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .image-section img {
      width: 300px;
      border: 6px solid #c2b280;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
      margin: 10px;
    }

    .quotes-section {
      max-width: 700px;
      margin: auto;
    }

    /* Base quote style */
    .quote {
      padding: 15px 20px;
      border-radius: 20px;
      margin: 15px 0;
      color: black;
      font-size: 18px;
      position: relative;
    }

    .quote::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 20px;
      border-width: 10px;
      border-style: solid;
      border-color: transparent;
    }

    .character-name {
      font-weight: bold;
      margin-top: 5px;
      font-size: 14px;
    }

    /* CHARACTER COLORS */

    .vex {
      background-color: #78D8DF;
    }

    .vex::after {
      border-top-color: teal;
    }

    .cassandra {
      background-color: #800020;
    }

    .cassandra::after {
      border-top-color: #800020;
    }

    .augustus {
      background-color: #5a189a;
    }

    .augustus::after {
      border-top-color: #5a189a;
    }

    /* Suggestion button */

    .suggestion-button {
      display: block;
      width: 220px;
      margin: 50px auto 0;
      padding: 12px;
      text-align: center;
      background-color: #8b6f47;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .suggestion-button:hover {
      background-color: #6e5436;
    }

  </style>
</head>

<body>

  <h1>The Chronicle</h1>
  <div class="subtitle">Fragments of History Preserved in Ink</div>

  <!-- IMAGES -->
  <div class="image-section">
    <img src="hyun.PNG" alt="Historical Image">
    <img src="nikkiandjamie.PNG" alt="Historical Image">
     <img src="farisandyumi.jpg" alt="Historical Image">
  </div>

  <!-- QUOTES -->
  <div class="quotes-section">

    <!-- VEX -->
    <div class="quote vex">
      "But you can't hold that against me."
      <div class="character-name">— Vex</div>
    </div>

      <!-- Put quotes here -->
   
  </div>

  <a href="suggestions.html" target="_blank" class="suggestion-button">
    Leave a Suggestion
  </a>

</body>
</html>
