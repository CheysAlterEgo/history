<!DOCTYPE html>
<html>
<head>
  <title>The Chronicle</title>

  <style>

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Georgia", serif;
      background-color: #f4f1ea;
      color: #2f2a25;
    }

    /* NAVIGATION BAR */

    .navbar {
      background-color: #8b6f47;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .navbar a:hover {
      color: #f4f1ea;
      text-decoration: underline;
    }

    .content {
      padding: 40px;
    }

    h1 {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-style: italic;
      margin-bottom: 40px;
    }

    /* IMAGE SECTION */

    .image-section {
      text-align: center;
      margin-bottom: 60px;
    }

    .image-section img {
      width: 300px;
      height: 400px;
      object-fit: cover;
      border: 6px solid #c2b280;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
      margin: 10px;
    }

    /* QUOTES SECTION */

    .quotes-section {
      max-width: 700px;
      margin: auto;
      margin-bottom: 60px;
    }

    .quote {
      padding: 15px 20px;
      border-radius: 20px;
      margin: 20px 0;
      color: black;
      font-size: 18px;
      position: relative;
    }

    .quote::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 20px;
      border-width: 10px;
      border-style: solid;
      border-color: transparent;
    }

    .character-name {
      font-weight: bold;
      margin-top: 5px;
      font-size: 14px;
    }

    /* CHARACTER COLORS */

    .vex {
      background-color: #78D8DF;
    }

    .vex::after {
      border-top-color: #78D8DF;
    }

    .cassandra {
      background-color: #800020;
      color: white;
    }

    .cassandra::after {
      border-top-color: #800020;
    }

    .augustus {
      background-color: #5a189a;
      color: white;
    }

    .augustus::after {
      border-top-color: #5a189a;
    }

    /* SUGGESTION BUTTON SECTION */

    .suggestion-section {
      text-align: center;
      margin-bottom: 80px;
    }

    .suggestion-button {
      display: inline-block;
      padding: 12px 25px;
      background-color: #8b6f47;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
      font-weight: bold;
    }

    .suggestion-button:hover {
      background-color: #6e5436;
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <a href="#images">Images</a>
    <a href="#quotes">Quotes</a>
    <a href="#suggestions">Suggestions</a>
  </div>

  <div class="content">

    <h1>The Chronicle</h1>
    <div class="subtitle">Fragments of History Preserved in Ink</div>

    <!-- IMAGES -->
    <div id="images" class="image-section">
      <h2>Historical Images</h2>
      <img src="nikkiandjamie.PNG" alt="Historical Image">
      <img src="hyun.PNG" alt="Historical Image">
      <img src="farisandyumi.jpg" alt="Historical Image">
    </div>

    <!-- QUOTES -->
    <div id="quotes" class="quotes-section">
      <h2>Recorded Dialogue</h2>

      <div class="quote vex">
        "But you can't hold that against me."
        <div class="character-name">— Vex</div>
      </div>

      <!-- Add more quotes below -->

    </div>

    <!-- SUGGESTIONS -->
    <div id="suggestions" class="suggestion-section">
      <h2>Contribute to the Archive</h2>
      <a href="suggestions.html" target="_blank" class="suggestion-button">
        Leave a Suggestion
      </a>
    </div>

  </div>

</body>
</html>
